plugins {
    id 'com.android.application'
}

def configuredWebUrl = project.findProperty('webAppUrl') ?: 'https://YOUR_GITHUB_USERNAME.github.io/NalarAI/'

android {
    namespace 'com.nalarai.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nalarai.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'WEB_APP_URL', '"' + configuredWebUrl.replace('"', '\\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
